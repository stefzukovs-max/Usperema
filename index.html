<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1a15">
<title>Iron Accord — A Grand Strategy of the Present Day</title>
<link rel="stylesheet" href="styles/main.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231b1a15'/><g fill='none' stroke='%23c8a24a' stroke-width='2.4'><circle cx='16' cy='16' r='9'/><path d='M16 4v24M4 16h24'/></g></svg>">
</head>
<body>

<!-- ------------------------------------------------------------------ menu -->
<div id="menu" class="screen">
  <div class="menu-inner">
    <header class="brand">
      <!-- Original mark: a compass rose crossed by rifles, drawn in CSS/SVG. -->
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="21" class="mk-ring"/>
        <circle cx="32" cy="32" r="14" class="mk-ring thin"/>
        <path d="M32 6v52M6 32h52" class="mk-cross"/>
        <path d="M32 12l4 20-4 6-4-6z" class="mk-needle"/>
        <path d="M14 50L50 14M14 14l36 36" class="mk-rifles"/>
      </svg>
      <div id="brandKicker" class="brand-kicker">MMXXVI</div>
      <h1 class="brand-title">Iron <span>Accord</span></h1>
      <p id="brandSub" class="brand-sub">Real-time grand strategy on the world as it stands. Take a
        nation, feed its industry, raise its armies, hold its alliances together — and decide how
        the century turns out.</p>
    </header>

    <div class="menu-controls">
      <label class="seed-field">
        <span>Campaign seed</span>
        <input id="seedInput" type="text" placeholder="leave blank for a fresh campaign" autocomplete="off">
      </label>
      <button id="startBtn" class="primary-btn">Begin the War</button>
      <button id="continueBtn" class="secondary-btn" style="display:none">Continue</button>
      <button id="settingsBtn" class="secondary-btn">Campaign settings</button>
    </div>

    <div id="settingsPanel" class="settings-panel">
      <h2 class="menu-heading">Campaign settings</h2>
      <div id="settingsGrid" class="settings-grid"></div>
      <div class="settings-foot">
        <button id="settingsReset" class="ghost">Restore defaults</button>
      </div>
    </div>

    <div class="menu-heading-row">
      <h2 class="menu-heading">Choose your power<span id="nationCount" class="menu-count"></span></h2>
      <input id="nationSearch" class="search-input" type="search" placeholder="Search power or capital" autocomplete="off">
    </div>
    <div id="nationGrid" class="nation-grid"></div>
  </div>
</div>

<!-- --------------------------------------------------------------- loading -->
<div id="loading" class="overlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div>Drawing the front…</div>
  </div>
</div>

<!-- ------------------------------------------------------------------ game -->
<div id="game" class="screen">

  <header id="topbar">
    <div class="top-row">
      <div class="hud-nation">
        <span id="hudFlag" class="chip big"></span>
        <span id="hudNation">—</span>
      </div>
      <div class="hud-clock">
        <span class="hud-icon">&#128197;</span><span id="hudDay">1</span>
        <span class="hud-icon">&#128347;</span><span id="hudClock">00:00</span>
      </div>
      <div id="hudVp" class="hud-vp">0/0 VP</div>
    </div>
    <div id="resourceStrip" class="resource-strip"></div>
  </header>

  <div id="mapWrap">
    <canvas id="map"></canvas>
    <div id="speedControls" class="speed-controls"></div>
    <div id="mapModes" class="map-modes"></div>
    <div id="mapLegend" class="map-legend"></div>
    <div id="targetingBar" class="targeting-bar">
      <span id="targetingText">Select a target</span>
      <button id="cancelTargeting" class="ghost">Cancel</button>
    </div>
    <div id="toasts" class="toasts"></div>
    <div id="tutorial" class="tutorial"></div>
  </div>

  <section id="panel" class="panel">
    <div class="panel-head">
      <div>
        <div id="panelTitle" class="panel-title">—</div>
        <div id="panelSub" class="panel-sub"></div>
      </div>
      <button id="closePanel" class="icon-btn">✕</button>
    </div>
    <div id="panelBody" class="panel-body"></div>
  </section>

  <nav id="bottomNav" class="bottom-nav"></nav>
</div>

<!-- ----------------------------------------------------------------- modal -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">—</h2>
      <button id="modalClose" class="icon-btn">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<!-- --------------------------------------------------------------- confirm -->
<div id="confirmLayer" class="confirm-layer"></div>

<!-- ------------------------------------------------------------- game over -->
<div id="gameOver" class="overlay">
  <div class="over-box">
    <h2 id="overTitle">Victory</h2>
    <p id="overText"></p>
    <div class="over-actions">
      <button id="overRestart" class="primary-btn">New campaign</button>
      <button id="overWatch" class="secondary-btn">Keep watching</button>
    </div>
  </div>
</div>

<script src="src/engine/rng.js"></script>
<script src="src/engine/util.js"></script>
<script src="src/data/worldmap.js"></script>
<script src="src/data/units.js"></script>
<script src="src/data/buildings.js"></script>
<script src="src/data/research.js"></script>
<script src="src/data/commanders.js"></script>
<script src="src/engine/mapdata.js"></script>
<script src="src/engine/worldgen.js"></script>
<script src="src/engine/relief.js"></script>
<script src="src/game/weather.js"></script>
<script src="src/game/market.js"></script>
<script src="src/game/diplomacy.js"></script>
<script src="src/game/state.js"></script>
<script src="src/game/economy.js"></script>
<script src="src/game/naval.js"></script>
<script src="src/game/combat.js"></script>
<script src="src/game/orders.js"></script>
<script src="src/game/ai.js"></script>
<script src="src/game/commanders.js"></script>
<script src="src/game/espionage.js"></script>
<script src="src/game/victory.js"></script>
<script src="src/game/loop.js"></script>
<script src="src/game/save.js"></script>
<script src="src/ui/icons.js"></script>
<script src="src/ui/audio.js"></script>
<script src="src/ui/tutorial.js"></script>
<script src="src/ui/renderer.js"></script>
<script src="src/ui/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
